# Render Blueprint for the Manim animation server (free tier).
# Deploy: https://render.com/deploy?repo=https://github.com/sunnylabh/TeXtoImG
services:
  - type: web
    name: textoimg-manim
    runtime: docker
    plan: free
    dockerfilePath: ./manim-server/Dockerfile
    dockerContext: ./manim-server
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - manim-server/**
    envVars:
      # The free tier has 0.1 CPU and 512 MB RAM: keep renders small and serial
      - key: MANIM_MAX_QUALITY
        value: low
      - key: MANIM_CONCURRENCY
        value: "1"
      - key: MANIM_RENDER_TIMEOUT
        value: "300"
      - key: ALLOWED_ORIGINS
        value: https://teximg.pages.dev,http://localhost:5173
